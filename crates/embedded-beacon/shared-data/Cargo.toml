[package]
name = "reth-embedded-beacon-shared-data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Owned content-addressed storage for embedded beacon data"

[lints]
workspace = true

[dependencies]
reth-fs-util.workspace = true
parking_lot.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

# reth
reth-transaction-pool = { workspace = true, optional = true }
alloy-eips = { workspace = true, optional = true }
alloy-primitives = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true

[features]
default = []
test-utils = ["reth-transaction-pool?/test-utils"]
reth = ["dep:reth-transaction-pool", "dep:alloy-eips", "dep:alloy-primitives"]
