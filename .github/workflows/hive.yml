                tests/amsterdam/eip7928_block_level_access_lists/test_block_access_lists_invalid\.py::test_bal_invalid_non_minimal_scalar_encoding\[fork_Amsterdam-blockchain_test_engine-header_commits_to_payload_rlp-field_storage_slot]
                | tests/amsterdam/eip7928_block_level_access_lists/test_block_access_lists_invalid\.py::test_bal_invalid_engine_payload_encoding\[fork_Amsterdam-blockchain_test_engine-header_commits_to_payload_rlp-rlp_truncated_list]
                | tests/amsterdam/eip7928_block_level_access_lists/test_fork_transition\.py::test_bal_invalid_engine_payload_field_before_fork\[fork_BPO2ToAmsterdamAtTime15k-blockchain_test_engine]
                | tests/amsterdam/eip8037_state_creation_gas_cost_increase/test_state_gas_system_calls\.py::test_system_call_execution_boundary\[fork_Amsterdam-blockchain_test_engine-history-one_over]
                | tests/amsterdam/eip8037_state_creation_gas_cost_increase/test_state_gas_system_calls\.py::test_system_call_execution_grant\[fork_Amsterdam-blockchain_test_engine-history]
                | tests/amsterdam/eip8037_state_creation_gas_cost_increase/test_block_2d_gas_accounting\.py::test_tx_total_gas_limit_cap\[fork_Amsterdam-tx_type_2-blockchain_test_engine_from_state_test-above_cap]
                | tests/amsterdam/eip8282_builder_execution_requests/test_contract_deployment\.py::test_builder_exit_contract_deployment\[fork_BPO2ToAmsterdamAtTime15k-blockchain_test_engine-deploy_after_fork-nonzero_balance]
                | tests/amsterdam/eip7928_block_level_access_lists/test_block_access_lists_invalid\.py::test_bal_invalid_engine_payload_encoding\[fork_Amsterdam-blockchain_test_engine-header_commits_to_payload_rlp-rlp_non_list]
                | tests/amsterdam/eip8037_state_creation_gas_cost_increase/test_state_gas_system_calls\.py::test_system_call_reservoir_boundary\[fork_Amsterdam-blockchain_test_engine-allow_spill_True-history]
                | tests/amsterdam/eip8037_state_creation_gas_cost_increase/test_state_gas_fork_transition\.py::test_tx_total_gas_limit_cap_at_transition\[fork_BPO2ToAmsterdamAtTime15k-blockchain_test_engine-above_total_cap]
                | tests/amsterdam/eip7843_slotnum/test_fork_transition\.py::test_invalid_pre_fork_block_with_slot_number\[fork_BPO2ToAmsterdamAtTime15k-blockchain_test_engine-header_field]
