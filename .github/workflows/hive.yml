          # - sim: ethereum/eels/consume-engine
          # limit: .*tests/istanbul.*
          # - sim: ethereum/eels/consume-engine
          # limit: .*tests/homestead.*
          # - sim: ethereum/eels/consume-engine
          # limit: .*tests/frontier.*
          # - sim: ethereum/eels/consume-engine
          # limit: .*tests/paris.*
          #
          # # Focused EIP-8141 frame cases for engine debugging.
          # - sim: ethereum/eels/consume-engine
          # limit: '.*tests/amsterdam/eip8141_frame_transactions/.*(test_target_resolution\.py::test_dead_target_entry_charge\[fork_Bogota-blockchain_test_engine_from_state_test-(affordable|unaffordable)\]|test_expiry_verifier\.py::test_expiry_verifier_frame\[fork_Bogota-blockchain_test_engine_from_state_test-(future_expiry|expiry_at_block_timestamp)\]|test_target_resolution\.py::test_delegated_to_precompile_target\[fork_Bogota-blockchain_test_engine_from_state_test\]|test_target_resolution\.py::test_verify_frame_delegated_to_precompile_target\[fork_Bogota-blockchain_test_engine_from_state_test\]|test_admission_validity\.py::test_admission_constraints\[fork_Bogota-blockchain_test_engine_from_state_test-max_cost_within_bound\]|test_frame_transactions\.py::test_atomic_batch_rollback\[fork_Bogota-blockchain_test_engine_from_state_test-unrolls_executed_frames\]|test_block_access_lists\.py::test_bal_unaffordable_designation_absent\[fork_Bogota-blockchain_test_engine\]|test_block_access_lists\.py::test_bal_atomic_batch_write\[fork_Bogota-blockchain_test_engine-unrolled\]).*'
          #
          # # Focused EIP-8141 frame cases for RLP debugging.
          # - sim: ethereum/eels/consume-rlp
