name: rpc-compat

on:
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ (github.repository == 'paradigmxyz/reth' || github.repository == 'paradigmxyz/reth-oss') && 'depot-ubuntu-latest-4' || 'ubuntu-latest' }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
      - run: .github/scripts/install_llvm.sh ubuntu
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true
      - name: Restore fixture cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/rpc-compat
          key: rpc-compat-${{ github.run_id }}
          restore-keys: rpc-compat-
      - name: Resolve and fetch latest fixture
        id: fixture
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          revision="$(
            cargo run --locked -p reth-rpc-compat-tests --bin reth-rpc-compat --no-default-features -- fetch
          )"
          echo "revision=$revision"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Save fixture cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/rpc-compat
          key: rpc-compat-${{ steps.fixture.outputs.revision }}
      - name: Validate fixture and schemas
        run: cargo run --locked -p reth-rpc-compat-tests --bin reth-rpc-compat --no-default-features -- check --offline
      - name: Run RPC compatibility suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target/rpc-compat
          rm -f target/rpc-compat/report.json
          cargo run --locked -p reth-rpc-compat-tests --bin reth-rpc-compat --features embedded -- run --offline 2>&1 |
            tee target/rpc-compat/run.log ||
            test -f target/rpc-compat/report.json
      - name: Parse test result
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("target/rpc-compat/report.json")
          log_path = Path("target/rpc-compat/run.log")
          if report_path.exists() and log_path.exists():
              report = json.loads(report_path.read_text())
              unexpected = {
                  result["id"]
                  for result in report["results"]
                  if result["outcome"] in {"fail", "xpass"}
              }
              lines = log_path.read_text(errors="replace").splitlines(keepends=True)
              current = None
              bal = []

              def emit():
                  if current in unexpected and bal:
                      print(f"::group::eth_simulate BAL: {current}")
                      print("".join(bal), end="")
                      print("::endgroup::")

              index = 0
              while index < len(lines):
                  line = lines[index]
                  if line.startswith("RPC_COMPAT_TEST_START "):
                      emit()
                      current = line.removeprefix("RPC_COMPAT_TEST_START ").strip()
                      bal = []
                  elif "eth_simulate BAL:" in line:
                      block = [line]
                      if "Some(" in line and line.rstrip().endswith("("):
                          index += 1
                          while index < len(lines):
                              block.append(lines[index])
                              if lines[index].strip() == ")":
                                  break
                              index += 1
                      bal.append("".join(block))
                  index += 1
              emit()
          PY
          cargo run --locked -p reth-rpc-compat-tests --bin reth-rpc-compat --no-default-features -- list-unexpected --color always --github-groups --fail-on-unexpected
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rpc-compat-reports
          path: target/rpc-compat
          if-no-files-found: warn

  geth-fixture:
    name: RPC compatibility against go-ethereum fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Checkout execution-apis
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: MysticRyuujin/execution-apis
          ref: amsterdam-chain
          path: execution-apis
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: execution-apis/tools/go.mod
          cache-dependency-path: execution-apis/tools/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true
      - name: Instrument go-ethereum block access lists
        working-directory: execution-apis/tools
        shell: bash
        run: |
          set -euo pipefail
          go mod download github.com/ethereum/go-ethereum
          geth_dir="$(go list -m -f '{{.Dir}}' github.com/ethereum/go-ethereum)"
          chmod u+w "$geth_dir/internal/ethapi/simulate.go"
          python3 - "$geth_dir/internal/ethapi/simulate.go" cmd/rpctestgen/generate.go <<'PY'
          from pathlib import Path
          import sys

          simulate = Path(sys.argv[1])
          source = simulate.read_text()
          needle = "\t// Assemble the block\n\tb := core.AssembleBlock(chainHeadReader, header, sim.state, blockBody, receipts, blockAccessList)\n\n\trepairLogs(callResults, b.Hash())"
          replacement = "\t// Assemble the block\n\tb := core.AssembleBlock(chainHeadReader, header, sim.state, blockBody, receipts, blockAccessList)\n\n\taccessList := \"<nil>\"\n\tif b.AccessList() != nil {\n\t\taccessList = b.AccessList().PrettyPrint()\n\t}\n\tfmt.Printf(\"GETH_ETH_SIMULATE_BAL: block=%d txs=%d hash=%v\\n%sGETH_ETH_SIMULATE_BAL_END\\n\", header.Number.Uint64(), len(block.Calls), b.BlockAccessListHash(), accessList)\n\n\trepairLogs(callResults, b.Hash())"
          if needle not in source:
              raise SystemExit(f"Geth simulation hook not found in {simulate}")
          simulate.write_text(source.replace(needle, replacement, 1))

          generator = Path(sys.argv[2])
          source = generator.read_text()
          needle = "\t\t\tfilename := fmt.Sprintf(\"%s/%s.io\", methodDir, test.Name)\n\t\t\tfmt.Printf(\"generating %s\", filename)"
          replacement = "\t\t\tfilename := fmt.Sprintf(\"%s/%s.io\", methodDir, test.Name)\n\t\t\tfmt.Printf(\"GETH_FIXTURE_TEST_START %s/%s\\n\", methodTest.Name, test.Name)\n\t\t\tfmt.Printf(\"generating %s\\n\", filename)"
          if needle not in source:
              raise SystemExit(f"Fixture-generator hook not found in {generator}")
          generator.write_text(source.replace(needle, replacement, 1))
          PY
      - name: Generate fixtures with go-ethereum
        working-directory: execution-apis
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/target/rpc-compat-geth"
          echo "execution-apis=$(git rev-parse HEAD)"
          grep 'github.com/ethereum/go-ethereum ' tools/go.mod
          make -C tools build geth
          tools/rpctestgen -v --bin tools/geth --chain tools/chain --out tests 2>&1 |
            tee "$GITHUB_WORKSPACE/target/rpc-compat-geth/geth-fixture.log"
      - name: Check generated fixtures
        run: cargo run --locked -p reth-rpc-compat-tests --bin reth-rpc-compat --no-default-features -- check --offline --fixture "$GITHUB_WORKSPACE/execution-apis"
      - name: Run eth_simulate compatibility against generated fixtures
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target/rpc-compat-geth
          rm -f target/rpc-compat-geth/report.json
          cargo run --locked -p reth-rpc-compat-tests --bin reth-rpc-compat --features embedded -- run \
            --offline \
            --fixture "$GITHUB_WORKSPACE/execution-apis" \
            --include 'eth_simulateV1/*' \
            --report-json "$GITHUB_WORKSPACE/target/rpc-compat-geth/report.json" \
            --report-junit "$GITHUB_WORKSPACE/target/rpc-compat-geth/junit.xml" 2>&1 |
            tee target/rpc-compat-geth/run.log ||
            test -f target/rpc-compat-geth/report.json
      - name: Report generated-fixture result
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("target/rpc-compat-geth/report.json")
          log_path = Path("target/rpc-compat-geth/run.log")
          if report_path.exists() and log_path.exists():
              report = json.loads(report_path.read_text())
              unexpected = {
                  result["id"]
                  for result in report["results"]
                  if result["outcome"] in {"fail", "xpass"}
              }
              lines = log_path.read_text(errors="replace").splitlines(keepends=True)
              current = None
              bal = []

              reth_bals = {}

              def emit():
                  if current in unexpected and bal:
                      reth_bals[current] = "".join(bal)

              index = 0
              while index < len(lines):
                  line = lines[index]
                  if line.startswith("RPC_COMPAT_TEST_START "):
                      emit()
                      current = line.removeprefix("RPC_COMPAT_TEST_START ").strip()
                      bal = []
                  elif "eth_simulate BAL:" in line:
                      block = [line]
                      if "Some(" in line and line.rstrip().endswith("("):
                          index += 1
                          while index < len(lines):
                              block.append(lines[index])
                              if lines[index].strip() == ")":
                                  break
                              index += 1
                      bal.append("".join(block))
                  index += 1
              emit()

              geth_bals = {}
              fixture_log = Path("target/rpc-compat-geth/geth-fixture.log")
              if fixture_log.exists():
                  current = None
                  lines = fixture_log.read_text(errors="replace").splitlines(keepends=True)
                  index = 0
                  while index < len(lines):
                      line = lines[index]
                      if line.startswith("GETH_FIXTURE_TEST_START "):
                          current = line.removeprefix("GETH_FIXTURE_TEST_START ").strip()
                      elif line.startswith("GETH_ETH_SIMULATE_BAL:") and current:
                          block = [line]
                          index += 1
                          while index < len(lines):
                              block.append(lines[index])
                              if lines[index].strip() == "GETH_ETH_SIMULATE_BAL_END":
                                  break
                              index += 1
                          geth_bals.setdefault(current, []).append("".join(block))
                      index += 1

              for test_id in sorted(unexpected):
                  if not test_id.startswith("eth_simulateV1/"):
                      continue
                  print(f"::group::BAL comparison: {test_id}")
                  print("--- go-ethereum BAL ---")
                  print("".join(geth_bals.get(test_id, ["<no Geth BAL captured>\\n"])), end="")
                  print("--- Reth BAL ---")
                  print(reth_bals.get(test_id, "<no Reth BAL captured>\\n"), end="")
                  print("::endgroup::")
                  fixture_path = Path("execution-apis/tests") / f"{test_id}.io"
                  if not fixture_path.exists():
                      continue
                  print(f"::group::go-ethereum expected response: {test_id}")
                  for line in fixture_path.read_text(errors="replace").splitlines():
                      if line.startswith("<<"):
                          print(line)
                  print("::endgroup::")
          PY
          if test -f target/rpc-compat-geth/report.json; then
            cargo run --locked -p reth-rpc-compat-tests --bin reth-rpc-compat --no-default-features -- list-unexpected \
              --report target/rpc-compat-geth/report.json \
              --color always --github-groups --fail-on-unexpected
          fi
      - name: Upload generated-fixture reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rpc-compat-geth-reports
          path: target/rpc-compat-geth
          if-no-files-found: warn
